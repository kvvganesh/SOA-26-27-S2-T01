spring.application.name=AdaptiveMFA-ACS
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/adaptive_mfa
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# OTP DELIVERY (e-mail)
# =====================================================
# Credentials come from ENVIRONMENT VARIABLES - never write a password here.
#
#   Gmail:   MAIL_USERNAME=you@gmail.com
#            MAIL_PASSWORD=<16-character Google "App Password">
#   MailHog (local fake inbox, see http://localhost:8025):
#            MAIL_HOST=localhost MAIL_PORT=1025
#            MAIL_SMTP_AUTH=false MAIL_STARTTLS=false
#
# To print OTPs in the console instead of e-mailing (development only):
#            SPRING_PROFILES_ACTIVE=dev
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Never let a slow / unreachable mail server freeze a login request.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

